<footer class="site-footer">
  <div class="container pb-4">
    <div class="row">
      <div class="col-md-12 text-center">
        {{ with site.Params.footer.copyright.notice }}
        <p class="copyright mb-5">{{ replace . "{year}" now.Year | markdownify | emojify }}</p>
        {{ end }}
      </div>
    </div>
  </div>
</footer>

{{ if eq .RelPermalink "/publications/" }}
<script>
  (() => {
    function initPublicationYears() {
      const nav = document.querySelector('#pai-years .pai-years-list');
      if (!nav) return;

      const entries = Array.from(document.querySelectorAll('#pai-publications .pai-paper-entry[data-year]'));
      const years = [...new Set(entries.map((entry) => entry.dataset.year))]
        .filter((year) => /^\d{4}$/.test(year))
        .sort((a, b) => Number(b) - Number(a));

      function selectedYear() {
        const requested = window.location.hash.match(/^#pai-year-(\d{4})$/)?.[1];
        return years.includes(requested) ? requested : years[0];
      }

      function showYear(year) {
        let number = 0;
        for (const entry of entries) {
          entry.hidden = entry.dataset.year !== year;
          if (!entry.hidden) {
            entry.querySelector('.pai-paper-number').textContent = `${++number}.`;
          }
        }
        for (const link of nav.querySelectorAll('a')) {
          if (link.dataset.year === year) {
            link.setAttribute('aria-current', 'true');
          } else {
            link.removeAttribute('aria-current');
          }
        }
      }

      for (const year of years) {
        const link = document.createElement('a');
        link.href = `#pai-year-${year}`;
        link.dataset.year = year;
        link.textContent = year;
        link.addEventListener('click', (event) => {
          event.preventDefault();
          window.location.hash = `pai-year-${year}`;
          showYear(year);
        });
        nav.appendChild(link);
      }

      window.addEventListener('hashchange', () => showYear(selectedYear()));
      if (years.length) showYear(selectedYear());
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPublicationYears, { once: true });
    } else {
      initPublicationYears();
    }
  })();
</script>
{{ end }}
